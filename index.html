<main class="wrap">

  <!-- ===== SECTION: ABOUT ===== -->
  <section id="about">
    <div class="section-head">
      <h2>About</h2>
      <!-- Small label on the right of the "About" heading. -->
      <span class="eyebrow count">Assistant Professor, since Jan 2025</span>
    </div>
    <div class="about-grid">
      <!-- Bio: each <p> is one paragraph. Add or remove <p>...</p> blocks freely. -->
      <div>
        <p>Gio joined the Department of Physics at the University of Puerto Rico – Mayagüez in January 2025. His research sits at the interface of physical oceanography and atmospheric science, using regional ocean models, wave-dynamics simulations, and hydrometeorological forecasting to understand the Caribbean's climate system — from basin-scale circulation down to the individual storms and swells that reach its coasts.</p>
        <p>Before UPRM, he held a postdoctoral fellowship with the NCAR Advanced Study Program and a graduate fellowship through the NCAR Graduate Visitor Program, both based at the University of Colorado Boulder, where he completed his Ph.D. under Donata Giglio. That work runs on high-performance computing — much of the ocean-model development below is carried out on NCAR's Derecho system.</p>
      </div>
      <!-- Quick-facts box on the right. Each block below is one row: a short label
           (fact-label) and its value (fact-val). Add/remove/reorder rows as needed. -->
      <div class="about-facts">
        <div>
          <div class="fact-label">Focus</div>
          <div class="fact-val">Regional ocean &amp; wave modeling, marine heatwaves, Caribbean hydrometeorology</div>
        </div>
        <div>
          <div class="fact-label">Toolkit</div>
          <div class="fact-val">MOM6, WaveWatch III / SWAN / FUNWAVE-TVD, Python (xarray, Dask), NCAR Derecho HPC</div>
        </div>
        <div>
          <div class="fact-label">Region</div>
          <div class="fact-val">Caribbean Sea &amp; western North Atlantic</div>
        </div>
      </div>
    </div>
  </section>
  <!-- ===== END: ABOUT ===== -->

  <!-- ===== SECTION: RESEARCH HIGHLIGHTS =====
       This is a list of project cards. TO ADD A NEW PROJECT: copy everything from
       one "<div class="card">" down to its matching closing "</div>" (a full card,
       shown as one block below) and paste it right before or after an existing one,
       then edit the title, tag, description, and status line. TO REMOVE A PROJECT:

  <section id="research">
    <div class="section-head">
      <h2>Research highlights</h2>
      <span class="eyebrow count">6 active lines</span>
    </div>
    <p class="lede">Current work spans model development, climate diagnostics, and forecasting — tied together by the Caribbean as a physical system.</p>
    <div style="height:26px"></div>

    <div class="card-grid">

      <!-- ---- one card: copy from here... ---- -->
      <div class="card">
        <div class="card-top">
          <h3>Caribbean marine heatwaves</h3>
          <span class="tag">1980–2025</span>
        </div>
        <p>A basin-wide climatology of marine heatwaves in the Caribbean Sea and the large-scale drivers behind their most extreme years — 1997, 2005, 2010, 2023, and 2024. The work traces a regional amplification mechanism tied to Amazon and Orinoco River freshwater outflow, which forms a near-surface "barrier layer" that traps heat at the surface.</p>
        <!-- no "active" class = amber dot (proposal / manuscript stage) -->
        <div class="status"><span class="dot"></span>Manuscript in preparation</div>
      </div>
      <!-- ---- ...to here. That's one full card. ---- -->

      <div class="card">
        <div class="card-top">
          <h3>Regional ocean modeling — CARIB12</h3>
          <span class="tag">MOM6 · Derecho</span>
        </div>
        <p>A high-resolution regional ocean model of the Caribbean built on MOM6. Current work compares vertical grid configurations (z25–z75) and diagnoses open-boundary instabilities to get mixed-layer depth, eddy kinetic energy, and water-mass structure right across the basin.</p>
        <!-- "active" class = teal dot (actively underway) -->
        <div class="status active"><span class="dot"></span>Active model development</div>
      </div>

      <div class="card">
        <div class="card-top">
          <h3>MAREJADAS — Caribbean swell dynamics</h3>
          <span class="tag">WW3→SWAN→FUNWAVE</span>
        </div>
        <p>Past, present, and future swell events along Puerto Rico's northern coast. The project links archaeological and reanalysis records to a nested wave-modeling cascade, projecting how coastal wave hazards may shift under a warming climate.</p>
        <div class="status"><span class="dot"></span>Proposal in development</div>
      </div>

      <div class="card">
        <div class="card-top">
          <h3>Afternoon thunderstorm predictability</h3>
          <span class="tag">Convection-permitting</span>
        </div>
        <p>Why afternoon thunderstorms over western Puerto Rico are so hard to forecast. This work disentangles synoptic, mesoscale, and microphysical sources of error using convection-permitting ensemble forecasts.</p>
        <div class="status active"><span class="dot"></span>Ongoing analysis</div>
      </div>

      <div class="card">
        <div class="card-top">
          <h3>Rain nowcasting, western Puerto Rico</h3>
          <span class="tag">0–6 h horizon</span>
        </div>
        <p>A short-range rainfall nowcasting system combining GOES-16 satellite imagery, MRMS radar-gauge precipitation, and USGS streamgages — built to flag flash-flood risk on the region's flashiest rivers.</p>
        <div class="status active"><span class="dot"></span>In development</div>
      </div>

      <div class="card">
        <div class="card-top">
          <h3>Puerto Rico precipitation climatology</h3>
          <span class="tag">1960–2019 · 7 zones</span>
        </div>
        <p>A 60-year, seven-zone comparison of Puerto Rico rainfall (1960–1989 vs. 1990–2019), showing a significant intensification of the second rainy season and its ties to Atlantic and Pacific climate modes.</p>
        <div class="status"><span class="dot"></span>Manuscript in preparation</div>
      </div>

    </div>
  </section>
  <!-- ===== END: RESEARCH HIGHLIGHTS ===== -->

    <div class="teach-row">

        <h3>Fluid Mechanics</h3>
        <p>An upper-division course on the physics of fluid motion — from the derivation of stability criteria like the Brunt–Väisälä frequency to material acceleration, compressible duct flow, and rotating-frame dynamics. The same equations that govern the ocean and atmosphere systems studied in the research above.</p>
      </div>

      <p>I'm looking for motivated undergraduate and graduate students interested in ocean and atmospheric modeling, climate data analysis, or Caribbean hydrometeorology. No prior modeling experience is required — a background in physics, math, computer science, or a related field, and genuine curiosity about how the ocean and atmosphere work, matter most.</p>

<!-- ==========================================================================================
     SCRIPT — page behavior, not content. Nothing to edit below this line under normal use:
       1) stamps the current year into the footer automatically
       2) fades each research card in as you scroll to it
       3) draws the animated wavy "bathymetric contour" lines behind the hero banner
     ========================================================================================== -->
<script>
(function(){
  document.getElementById('year').textContent = new Date().getFullYear();

  // Reveal research cards on scroll
  var cards = document.querySelectorAll('.card');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if('IntersectionObserver' in window && !reduceMotion){
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.isIntersecting){
          e.target.classList.add('in-view');
          io.unobserve(e.target);
        }
      });
    }, {threshold:.12});
    cards.forEach(function(c){ io.observe(c); });
  } else {
    cards.forEach(function(c){ c.classList.add('in-view'); });
  }

  // Bathymetric contour animation in hero
  var canvas = document.getElementById('contours');
  var ctx = canvas.getContext('2d');
  var hero = canvas.parentElement;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var w, h, t = 0;

  function resize(){
    w = hero.clientWidth;
    h = hero.clientHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }

  function strokeColor(){
    var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    var explicit = document.documentElement.getAttribute('data-theme');
    var isDark = explicit ? explicit === 'dark' : dark;
    return isDark ? 'rgba(95,202,191,ALPHA)' : 'rgba(21,125,116,ALPHA)';
  }

  var lines = 7;
  function draw(){
    ctx.clearRect(0,0,w,h);
    for(var i=0;i<lines;i++){
      var baseY = h * (0.12 + i * 0.13);
      var amp = 14 + i*3;
      var freq = 0.006 + i*0.0006;
      var phase = t*0.15 + i*0.6;
      var alpha = 0.5 - i*0.05;
      ctx.beginPath();
      for(var x=0; x<=w; x+=8){
        var y = baseY + Math.sin(x*freq + phase) * amp + Math.sin(x*freq*2.3 + phase*1.3) * amp*0.3;
        if(x===0){ ctx.moveTo(x,y); } else { ctx.lineTo(x,y); }
      }
      ctx.strokeStyle = strokeColor().replace('ALPHA', Math.max(alpha,0.06).toFixed(2));
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  function frame(){
    t += 0.6;
    draw();
    if(!reduceMotion){ requestAnimationFrame(frame); }
  }

  resize();
  draw();
  window.addEventListener('resize', resize);
  if(!reduceMotion){ requestAnimationFrame(frame); }
})();
</script>
